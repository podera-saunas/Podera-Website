<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- GSAP vendored locally: the cloud environment blocks public CDNs -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* PODERA tokens — brand/DESIGN_SYSTEM.md */
      @font-face { font-family: Inter; font-weight: 500; src: url(assets/fonts/inter-latin-500-normal.woff2) format('woff2'); }
      @font-face { font-family: Inter; font-weight: 700; src: url(assets/fonts/inter-latin-700-normal.woff2) format('woff2'); }
      @font-face { font-family: Inter; font-weight: 900; src: url(assets/fonts/inter-latin-900-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Instrument Serif'; src: url(assets/fonts/instrument-serif-latin-400-normal.woff2) format('woff2'); }
      /* Temporary stand-in for Tempting until the licensed file is supplied */
      @font-face { font-family: Allura; src: url(assets/fonts/allura-latin-400-normal.woff2) format('woff2'); }
      :root {
        --ground: #141414;
        --graphite: #2b2b2b;
        --gold: #c9a227;
        --gold-light: #e3c56a;
        --ink: #f6f1e4;
        --font-display: Inter, sans-serif;
        --font-script: Allura, cursive;
        --font-serif: 'Instrument Serif', serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--font-display);
        background-image: repeating-linear-gradient(90deg, rgba(246, 241, 228, 0.05) 0 1px, transparent 1px 24px);
      }
      .stack { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #eyebrow { color: var(--gold); font-weight: 700; font-size: 30px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 30px; }
      #script { color: var(--gold); font-family: var(--font-script); font-size: 170px; line-height: 1; margin-bottom: -40px; z-index: 2; }
      #hero { color: var(--ink); font-weight: 900; font-size: 160px; letter-spacing: -0.04em; line-height: 0.95; }
      #mark { color: var(--gold); font-weight: 700; font-size: 72px; letter-spacing: 0.2em; margin-top: 90px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="brand-card" class="stack clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="eyebrow">Portable Finnish sauna</div>
        <div id="script">Your escape,</div>
        <div id="hero">Every day</div>
        <div id="mark">PODERA</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#eyebrow', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out' }, 0.2);
      tl.fromTo('#script', { clipPath: 'inset(-20% 100% -20% -5%)' }, { clipPath: 'inset(-20% 0% -20% -5%)', duration: 0.7, ease: 'power2.inOut' }, 0.4);
      tl.fromTo('#hero', { opacity: 0, scale: 1.12, filter: 'blur(8px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power4.out' }, 1.0);
      tl.fromTo('#mark', { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.8, ease: 'power3.out' }, 1.8);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
